name: Build & Deploy store

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages via Actions (deploy straight from main — no gh-pages branch,
# no legacy Jekyll build). Needs pages:write + id-token:write.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -y && sudo apt-get install -y imagemagick jq ffmpeg

      - name: Resolve download links + resize screenshots + build
        run: make all
        # make all = fetch + screenshots + build → dist/
        # store-upload sizes are for manual upload only, never published
        env:
          STORE_SHOTS: "0"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow tells Bing (and through it DuckDuckGo and Yahoo), Seznam and
      # Yandex which URLs exist, so they do not wait for their own crawl of the
      # sitemap. The key is public by design: static/<key>.txt proves the site
      # owns it. A failed ping never fails the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          KEY=$(basename "$(ls static/*.txt | grep -E '/[0-9a-f]{32}\.txt$' | head -1)" .txt)
          HOST=$(tr -d '[:space:]' < CNAME)
          grep -o '<loc>[^<]*' dist/sitemap.xml | sed 's/<loc>//' \
            | jq -R . | jq -s --arg h "$HOST" --arg k "$KEY" \
                '{host: $h, key: $k, keyLocation: "https://\($h)/\($k).txt", urlList: .[:10000]}' > indexnow.json
          echo "URLs: $(jq '.urlList | length' indexnow.json)"
          for ep in https://api.indexnow.org/indexnow https://search.seznam.cz/indexnow; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$ep" \
              -H 'Content-Type: application/json; charset=utf-8' --data @indexnow.json)
            echo "$ep → $code"
          done
