# cloudflared tunnel config for http://ol1n.now
#
# The .now domain has no public TLS cert, so it is reachable only through this
# tunnel. The generated site uses relative URLs, so it is base-path agnostic.
#
# Setup (one-time, interactive — must be run by you):
#   1. cloudflared tunnel login
#   2. cloudflared tunnel create ol1n-now           # writes <TUNNEL_ID>.json here
#   3. fill in <TUNNEL_ID> below
#   4. cloudflared tunnel route dns ol1n-now ol1n.now
#   5. make tunnel        # serves dist/ locally and exposes it at http://ol1n.now
#
# DEFAULT (this file): proxy to a LOCAL static server (`make serve` on :8099).
#   - Always correct (root path, no base-path issues).
#   - Requires your machine to be running. `make tunnel` starts the server for you.
#
# ALTERNATIVE: proxy to the always-up GitHub Pages build instead. Pages serves a
#   project repo at /ol1n.now/, and cloudflared does NOT prepend an origin path,
#   so a plain proxy would 404. To use Pages as the tunnel origin, publish the
#   site to the org root site (repo `lioilsources.github.io`) so its URL is the
#   domain root, then swap the ingress service to:
#       service: https://lioilsources.github.io
#       originRequest:
#         httpHostHeader: lioilsources.github.io
#   GitHub Pages remains the public canonical HTTPS mirror either way.

tunnel: <TUNNEL_ID>
credentials-file: cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: ol1n.now
    service: http://localhost:8099
  - service: http_status:404
