<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#7b2ff7"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a5e"/>
      <stop offset="0.6" stop-color="#e0457b"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <clipPath id="print"><circle cx="256" cy="270" r="78"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- T-shirt -->
  <path filter="url(#sh)" fill="#fbf8f1" stroke="#1f1b2e" stroke-width="10" stroke-linejoin="round"
        d="M196 96 C214 122 298 122 316 96 L420 142 L462 228 L392 256 L384 236 L384 430 L128 430 L128 236 L120 256 L50 228 L92 142 Z"/>
  <path fill="none" stroke="#1f1b2e" stroke-width="10" stroke-linecap="round" d="M196 96 C214 136 298 136 316 96"/>
  <!-- the print: a sunset motif -->
  <g clip-path="url(#print)">
    <rect x="170" y="190" width="172" height="160" fill="url(#sky)"/>
    <circle cx="256" cy="282" r="30" fill="#ffe066"/>
    <path fill="#3b1f6e" d="M170 300 L215 266 L246 290 L286 252 L342 300 L342 350 L170 350 Z"/>
    <path fill="#1f1b2e" d="M170 322 L230 300 L282 318 L342 296 L342 350 L170 350 Z"/>
  </g>
  <circle cx="256" cy="270" r="78" fill="none" stroke="#1f1b2e" stroke-width="8"/>
  <!-- AI sparkle -->
  <path fill="#ffe066" stroke="#1f1b2e" stroke-width="5" stroke-linejoin="round"
        d="M356 170 L364 196 L390 204 L364 212 L356 238 L348 212 L322 204 L348 196 Z"/>
</svg>
