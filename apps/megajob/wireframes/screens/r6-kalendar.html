<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kalendář</title><link rel="stylesheet" href="../wf.css"></head>
<body class="screen">
<div class="wf-phone">
  <div class="wf-status">9:41</div>
  <div class="wf-body">
<div class="wf-title">Kalendář</div>
<div class="wf-row"><span class="wf-back">‹</span><b>6.–12. dubna</b><span class="wf-back">›</span></div>
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:1;position:relative">
<div style="text-align:center;font-size:12px;font-weight:650">Po</div><div style="text-align:center;font-size:12px;font-weight:650">Út</div><div style="text-align:center;font-size:12px;font-weight:650">St</div><div style="text-align:center;font-size:12px;font-weight:650">Čt</div><div style="text-align:center;font-size:12px;font-weight:650">Pá</div><div style="text-align:center;font-size:12px;font-weight:650">So</div><div style="text-align:center;font-size:12px;font-weight:650">Ne</div>
<div style="border:1px solid var(--line);border-radius:6px;min-height:430px"></div><div style="border:1px solid var(--line);border-radius:6px;min-height:430px"></div><div style="border:1px solid var(--line);border-radius:6px;min-height:430px"></div><div style="border:1px solid var(--line);border-radius:6px;min-height:430px"></div><div style="border:1px solid var(--line);border-radius:6px;min-height:430px"></div><div style="border:1px solid var(--line);border-radius:6px;min-height:430px"></div><div style="border:1px solid var(--line);border-radius:6px;min-height:430px"></div>
  <div style="position:absolute;left:0;width:calc(5*(100% - 24px)/7 + 16px);top:60px;height:190px;background:var(--blue);color:#fff;border-radius:8px;padding:8px;font-size:13px;font-weight:650">Obklady · Žižkov<br><span style="font-weight:400">7:00–15:30</span></div>
  <div style="position:absolute;left:calc((100% - 24px)/7 + 4px);width:calc((100% - 24px)/7);top:290px;text-align:center"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ink)"></span><div style="font-size:10px">16:00</div></div>
  <div class="hatch" style="position:absolute;left:calc(2*(100% - 24px)/7 + 8px);width:calc((100% - 24px)/7);top:330px;height:110px;border-radius:6px;font-size:10px;padding:4px;color:var(--ink)">Vlastní práce</div>
  <div style="position:absolute;left:calc(5*(100% - 24px)/7 + 20px);width:calc((100% - 24px)/7);top:60px;height:250px;border:2px dashed var(--ink);border-radius:8px;padding:4px;font-size:10px;background:#fff">Předběžně: malba · Karlín<br><span class="mute">zámek ve čtvrtek</span></div>
</div>
<div class="wf-row" style="font-size:12px;justify-content:flex-start;gap:14px">
  <span><span class="wf-badge" style="background:var(--blue);color:#fff">&nbsp;</span> Potvrzeno</span>
  <span><span class="wf-badge tentative">&nbsp;</span> Předběžně</span>
  <span><span class="wf-badge hatch">&nbsp;&nbsp;</span> Moje zaneprázdnění</span>
</div>
  </div>
  <div class="wf-tabbar"><span>Dnes</span><span>Nabídky</span><span class="on">Kalendář</span><span>Já</span></div>
</div>
<div class="wf-stamp"></div>
</body></html>
