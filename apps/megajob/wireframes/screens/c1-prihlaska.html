<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Přihláška</title><link rel="stylesheet" href="../wf.css"></head>
<body class="screen">
<div class="wf-phone">
  <div class="wf-status">9:41</div>
  <div class="wf-body">
<div class="wf-row"><span class="wf-back">‹ Zpět</span><span class="mute small">Krok 2 ze 4</span></div>
<div class="wf-progress"><i style="width:50%"></i></div>
<div class="wf-title">Co chcete udělat?</div>
<div class="wf-chips"><span class="wf-chip on">Koupelna</span><span class="wf-chip">Kuchyň</span><span class="wf-chip">Podlahy</span><span class="wf-chip">Celý byt</span><span class="wf-chip">Něco jiného</span></div>
<div class="wf-h">Přidejte fotky nebo krátké video</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
  <div class="wf-photo" style="aspect-ratio:1;min-height:0"></div><div class="wf-photo" style="aspect-ratio:1;min-height:0"></div><div class="wf-photo" style="aspect-ratio:1;min-height:0"><span>video</span></div>
  <div style="aspect-ratio:1;border:1.5px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--blue)">+</div>
</div>
<div class="wf-h">Kdy</div>
<div class="wf-field" style="color:var(--ink)">duben–květen</div>
<div class="wf-row start"><span class="wf-avatar">🎙</span><span>Můžete i namluvit</span></div>
<div class="wf-btns"><div class="wf-btn primary">Pokračovat</div></div>
  </div>
</div>
<div class="wf-stamp"></div>
</body></html>
