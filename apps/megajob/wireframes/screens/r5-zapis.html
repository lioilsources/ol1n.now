<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Zápis</title><link rel="stylesheet" href="../wf.css"></head>
<body class="screen">
<div class="wf-phone">
  <div class="wf-status">9:41</div>

<div class="wf-btns">
  <div class="wf-btn outline">Nahlásit problém</div>
  <div class="wf-btn primary">Fotky po</div>
</div>
  </div>
</div>
<div class="wf-stamp"></div>
